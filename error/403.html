<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>403 - Akses Ditolak | CMS Jabbar23</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0B0F19;
            color: #F8FAFC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Glow Backgrounds */
        .ambient-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.45;
            pointer-events: none;
            z-index: 0;
        }

        .glow-1 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, #EF4444 0%, rgba(239, 68, 68, 0) 70%);
            top: -100px;
            left: -100px;
            animation: pulse-glow 8s ease-in-out infinite alternate;
        }

        .glow-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #6366F1 0%, rgba(99, 102, 241, 0) 70%);
            bottom: -150px;
            right: -150px;
            animation: pulse-glow 10s ease-in-out infinite alternate-reverse;
        }

        .glow-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #0E7C7B 0%, rgba(14, 124, 123, 0) 70%);
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes pulse-glow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
            100% { transform: scale(1.15) translate(30px, -20px); opacity: 0.55; }
        }

        /* Grid overlay effect */
        .bg-grid {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
            background-size: 32px 32px;
            z-index: 1;
            mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 80%);
        }

        /* Container Card */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 540px;
            padding: 2.5rem;
            margin: 1.5rem;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 
                        0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            text-align: center;
            animation: slide-up 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slide-up {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Lock Icon Graphic */
        .icon-wrapper {
            position: relative;
            width: 96px;
            height: 96px;
            margin: 0 auto 1.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(99, 102, 241, 0.15));
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 24px;
            box-shadow: 0 12px 24px -6px rgba(239, 68, 68, 0.25);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .icon-wrapper svg {
            width: 48px;
            height: 48px;
            color: #EF4444;
            filter: drop-shadow(0 2px 8px rgba(239, 68, 68, 0.4));
        }

        /* Error Code Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 9999px;
            color: #FCA5A5;
            font-size: 0.875rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 1.25rem;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background-color: #EF4444;
            border-radius: 50%;
            box-shadow: 0 0 8px #EF4444;
        }

        /* Title & Description */
        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            line-height: 1.2;
            color: #FFFFFF;
            letter-spacing: -0.02em;
            margin-bottom: 0.875rem;
            background: linear-gradient(180deg, #FFFFFF 0%, #CBD5E1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            color: #94A3B8;
            margin-bottom: 2rem;
            font-weight: 400;
        }

        /* Action Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 0.875rem;
        }

        @media (min-width: 480px) {
            .btn-group {
                flex-direction: row;
            }
        }

        .btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0.875rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0E7C7B 0%, #149997 100%);
            color: #FFFFFF;
            box-shadow: 0 4px 14px rgba(14, 124, 123, 0.4);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #108E8D 0%, #18ADAA 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(14, 124, 123, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: #E2E8F0;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #FFFFFF;
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        /* Footer Info */
        .footer-note {
            margin-top: 2rem;
            font-size: 0.8125rem;
            color: #64748B;
        }

        .footer-note span {
            color: #94A3B8;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Ambient background effects -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>
    <div class="bg-grid"></div>

    <!-- Error Card -->
    <div class="container">
        <!-- Shield Lock Icon -->
        <div class="icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
            </svg>
        </div>

        <!-- Badge -->
        <div class="badge">
            <span class="badge-dot"></span>
            Error 403 • Restricted Area
        </div>

        <!-- Heading -->
        <h1>Akses Ditolak</h1>

        <!-- Text -->
        <p>
            Maaf, Anda tidak memiliki hak akses untuk melihat isi direktori atau sumber daya ini di <strong>CMS Jabbar23</strong>.
        </p>

        <!-- Buttons -->
        <div class="btn-group">
            <button onclick="history.back()" class="btn btn-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                </svg>
                Halaman Sebelumnya
            </button>
            <a href="/cms/index.php" class="btn btn-primary">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                </svg>
                Kembali ke Utama
            </a>
        </div>

        <!-- Footer credit -->
        <div class="footer-note">
            Sistem Informasi Management <span>CMS Jabbar23</span>
        </div>
    </div>

</body>
</html>
