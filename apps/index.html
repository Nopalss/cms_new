<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>jtracks – Download App</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0B0F1A;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 48px;
    }

    .logo img {
      width: 52px;
      height: 52px;
      object-fit: contain;
    }

    .logo-text {
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .logo-text span {
      color: #1A8FFF;
    }

    h1 {
      font-size: 40px;
      font-weight: 800;
      text-align: center;
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 14px;
      max-width: 520px;
    }

    p.sub {
      font-size: 16px;
      color: #7A8BAD;
      text-align: center;
      margin-bottom: 48px;
      line-height: 1.6;
      max-width: 400px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 18px 36px;
      border-radius: 14px;
      text-decoration: none;
      background: #1A8FFF;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
      background: #0A7AE8;
    }

    .btn svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #3A4D6F;
      text-align: center;
    }

    @media (max-width: 480px) {
      h1 { font-size: 28px; }
      .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="logo">
    <img src="jtracks.png" alt="jtracks logo" onerror="this.style.display='none'"/>
    <div class="logo-text">j<span>tracks</span></div>
  </div>

  <h1>Download jtracks<br/>sekarang</h1>
  <p class="sub">Klik tombol di bawah untuk download file APK langsung ke perangkatmu.</p>

  <!-- Ganti href dengan link APK kamu -->
  <a href="jtracks.apk" download class="btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    Download APK
  </a>

  <p class="note">Android 8.0+ · Aktifkan "Izinkan dari sumber tidak dikenal" di pengaturan</p>

</body>
</html>
